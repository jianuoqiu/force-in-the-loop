<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Updates &middot; ZeroFACT</title>
<link rel="stylesheet" href="assets/tabs.css">

<style>
/* palette and base type, matching index.html */
:root{
  --bg:#ffffff;
  --text:#4a4a4a;
  --head:#363636;
  --soft:#7a7a7a;
  --rule:#ededed;
  --rule2:#dbdbdb;
  --navy:#1f3864;
  --blue-ink:#2e75b6;
  --red:#c00000;
  --grey:#fafafa;
  --sans:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","DejaVu Sans Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--sans); font-size:16px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
.container{max-width:1008px; margin:0 auto; padding:0 24px}
h1,h2,h3{color:var(--head); font-weight:600; margin:0}
p{margin:0 0 16px}
p:last-child{margin-bottom:0}
a{color:var(--head)}
strong{color:var(--head); font-weight:600}
ul,ol{margin:0 0 16px; padding-left:22px}
li{margin-bottom:6px}
.f{color:var(--red); font-weight:600}
.k{color:var(--blue-ink); font-weight:600}
code{font-family:var(--mono); font-size:.87em; background:var(--grey);
     border:1px solid var(--rule); border-radius:3px; padding:1px 5px; color:var(--head)}
img,video{max-width:100%; height:auto; border-radius:9px}

/* page head */
.page-head{padding:54px 0 26px; border-bottom:1px solid var(--rule)}
.page-head h1{font-size:clamp(24px,4.4vw,34px); letter-spacing:-.012em; line-height:1.2; margin-bottom:8px}
.page-head .tag{color:var(--soft); font-size:16px; margin:0}

/* ── the log: one dated entry per week ─────────────────────────────── */
.log{padding:8px 0 80px}
.entry{padding:36px 0}
.entry + .entry{border-top:1px solid var(--rule)}
.entry .wk{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin:0 0 14px}
.entry .wk h2{font-size:21px; margin:0}
.entry .wk .dt{color:var(--soft); font-size:14px; font-variant-numeric:tabular-nums}
.entry h3{font-size:16.5px; margin:22px 0 6px}
.entry .todo{color:var(--soft); font-style:italic; font-size:14.5px}

@media (max-width:760px){
  body{font-size:15.5px; line-height:1.6}
  .container{padding:0 18px}
  .page-head{padding:34px 0 20px}
  .entry{padding:28px 0}
  .entry .wk h2{font-size:19px}
}
</style>

<header class="topbar">
  <div class="container">
    <a class="brand" href="index.html">ZeroFACT</a>
    <nav class="tabs" aria-label="Pages">
      <a href="index.html">Proposal</a>
      <a href="updates.html" aria-current="page">Updates</a>
    </nav>
  </div>
</header>

<div class="page-head">
  <div class="container">
    <h1>Project Updates</h1>
    <p class="tag">Weekly progress, newest first.</p>
  </div>
</div>

<main class="log">
  <div class="container">

    <!-- To add a week: copy one <article> block, paste it at the top of this
         list (newest first), bump the id and the title, set the dates, and
         replace the placeholder paragraph with notes. -->

    <article class="entry" id="week-1">
      <div class="wk"><h2>Week 1</h2><span class="dt">Sep 7 &ndash; Sep 13, 2026</span></div>
      <p class="todo">Nothing logged yet.</p>
    </article>

  </div>
</main>
